server {
  listen 8080;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # basic hardening (add HSTS at the TLS terminator in front of this container)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), payment=()" always;

  location /api/ {
    client_max_body_size 20m;   # three CNIC photos of up to 5 MB each
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # for uptime monitors and the container health check: 200 only when the API and database are ready and migrations are applied
  location = /healthz {
    proxy_pass http://api:8080/health/ready;
    access_log off;
  }

  # SignalR: WebSocket upgrade, and keep idle connections open
  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 1h;
    proxy_buffering off;
  }

  # settings and the app shell must never be served stale; built files have hashed names, so cache them hard
  location = /config.json { add_header Cache-Control "no-store" always; try_files $uri =404; }
  location = /index.html  { add_header Cache-Control "no-cache" always; }
  location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
